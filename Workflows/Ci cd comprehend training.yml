name: Deploy Comprehend Training Infrastructure

# Separate file from ci-cd-sentiment-analysis.yml BY DESIGN - so the training/eval
# pipeline can be modified and redeployed independently of the daily-use pipeline.
# Same DeployEnv/workflow_dispatch pattern as the sentiment analysis workflow.

on:
  push:
    branches:
      - dev
      - main
    paths:
      - "source/pipeline/lambda-functions/datalake-comprehend-train-*/**"
      - "source/pipeline/lambda-functions/datalake-comprehend-update-train-data/**"
      - "source/pipeline/step-functions/datalake-comprehend-training-temp.json"
      - "source/cloudformation/comprehend_training_stack.yml"
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

env:
  # MANUAL_DEPLOY_ENV is used ONLY for manual workflow_dispatch runs. Push-based
  # auto-deploys are completely unaffected - they always resolve DEPLOY_ENV from
  # the branch name (dev branch -> dev, main branch -> prod), exactly as before.
  #
  # To manually deploy to an environment other than dev: edit this value directly
  # in this file (e.g. change to "staging"), save/commit, then run the workflow
  # via workflow_dispatch in the GitHub Actions UI. IMPORTANT: change it back to
  # "dev" afterward - otherwise a future accidental manual run will silently
  # redeploy staging instead of dev.
  MANUAL_DEPLOY_ENV: dev

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, datalake]

    env:
      AWS_REGION: us-east-1

    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && env.MANUAL_DEPLOY_ENV || (github.ref == 'refs/heads/main' && 'production' || 'dev') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set environment variables based on trigger
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${MANUAL_DEPLOY_ENV}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi

          echo "CODEVERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"

      - name: Validate DEPLOY_ENV
        run: |
          # Catches a typo in the hardcoded MANUAL_DEPLOY_ENV value now, before
          # the Lambda build/upload steps run, rather than failing later at the
          # CloudFormation deploy step.
          case "${DEPLOY_ENV}" in
            dev|staging|prod)
              echo "DEPLOY_ENV=${DEPLOY_ENV} is valid."
              ;;
            *)
              echo "ERROR: DEPLOY_ENV='${DEPLOY_ENV}' is not valid. Must be exactly one of: dev, staging, prod." >&2
              echo "Check MANUAL_DEPLOY_ENV at the top of this workflow file for a typo." >&2
              exit 1
              ;;
          esac

      - name: Resolve artifact bucket/prefix and env token
        run: |
          # ARTIFACT_BUCKET: dev and staging share the SAME bucket (-build-dev) -
          # there is no separate staging artifact bucket in this project. Only
          # prod gets its own bucket. Fixing this here (and ONLY here) matters:
          # this used to be redeclared separately in two other steps below, and
          # a staging deploy would resolve to a "-build-staging" bucket that
          # doesn't exist, failing partway through with a bucket-not-found error.
          if [ "${DEPLOY_ENV}" == "prod" ]; then
            echo "ARTIFACT_BUCKET=psegli-datalakenonprodli-datalake-build-prod" >> $GITHUB_ENV
          else
            echo "ARTIFACT_BUCKET=psegli-datalakenonprodli-datalake-build-dev" >> $GITHUB_ENV
          fi

          # ARTIFACT_PREFIX: dev and prod use the normal "training-artifact"
          # folder. staging gets its own isolated "staging-training-artifact"
          # folder in the SAME bucket, so it never shares/overwrites dev's
          # artifact files despite living in the same bucket.
          if [ "${DEPLOY_ENV}" == "staging" ]; then
            echo "ARTIFACT_PREFIX=staging-training-artifact" >> $GITHUB_ENV
          else
            echo "ARTIFACT_PREFIX=training-artifact" >> $GITHUB_ENV
          fi

          # Same sharing logic as the daily pipeline: dev and staging deploys
          # share the same compiled zip artifacts (same nonprod tier, same code).
          if [ "${DEPLOY_ENV}" == "prod" ]; then
            echo "ARTIFACT_ENV_TOKEN=prod" >> $GITHUB_ENV
          else
            echo "ARTIFACT_ENV_TOKEN=dev" >> $GITHUB_ENV
          fi

      - name: Build and upload Lambda artifacts
        run: |
          LAMBDA_BASE="source/pipeline/lambda-functions"

          LAMBDAS=(
            "datalake-comprehend-train-actionable"
            "datalake-comprehend-train-final-output"
            "datalake-comprehend-train-gate"
            "datalake-comprehend-train-level2"
            "datalake-comprehend-train-level3"
            "datalake-comprehend-train-level3-classifier"
            "datalake-comprehend-train-level4"
            "datalake-comprehend-train-update-baseline"
            "datalake-comprehend-train-urgent"
            "datalake-comprehend-train-validate-output"
            "datalake-comprehend-update-train-data"
          )

          for name in "${LAMBDAS[@]}"; do
            SRC_DIR="${LAMBDA_BASE}/${name}/python"
            if [ -f "${SRC_DIR}/${name}.py" ]; then
              mkdir -p "build/${name}/python"
              cp "${SRC_DIR}/${name}.py" "build/${name}/python/"
              (cd "build/${name}" && zip -r "../../${name}.zip" python)
              aws s3 cp "${name}.zip" \
                "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/${name}_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.zip" \
                --no-verify-ssl
            else
              echo "WARNING: ${SRC_DIR}/${name}.py not found - skipping ${name}"
            fi
          done

      - name: Validate CloudFormation template
        run: |
          TEMPLATE="$GITHUB_WORKSPACE/source/cloudformation/comprehend_training_stack.yml"
          aws cloudformation validate-template --template-body file://"$TEMPLATE"

      - name: Deploy CloudFormation stack
        run: |
          TEMPLATE="$GITHUB_WORKSPACE/source/cloudformation/comprehend_training_stack.yml"
          STACK_NAME="datalake-comprehend-training-infra-${DEPLOY_ENV}"

          aws cloudformation deploy \
            --template-file "$TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              DeployEnv=${DEPLOY_ENV} \
              ArtifactBucket=${ARTIFACT_BUCKET} \
              CodeVersion=${CODEVERSION}

      - name: Print CloudFormation Events on Failure
        if: always()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "datalake-comprehend-training-infra-${DEPLOY_ENV}" \
            --query 'StackEvents[?ResourceStatus==`FAILED`]' \
            --max-items 50