name: Deploy Sentiment Analysis Infrastructure

# NOTE on triggers:
# Push-to-branch auto-deploy behavior is UNCHANGED:
#   - push to "dev" branch  -> auto-deploy DeployEnv=dev  (unchanged behavior)
#   - push to "main" branch -> auto-deploy DeployEnv=prod (unchanged behavior)
#
# workflow_dispatch (manual "Run workflow" trigger) no longer prompts for an
# environment at run time. Instead, MANUAL_DEPLOY_ENV below is a hardcoded
# value you edit directly in this file before running the workflow manually -
# this is the ONLY way to reach DeployEnv=staging, since no branch maps to it
# automatically. To deploy to staging: change MANUAL_DEPLOY_ENV to "staging"
# below, save/commit, then trigger "Run workflow" from the Actions tab.
# Change it back to "dev" (or whatever) afterward so a future accidental
# manual run doesn't silently redeploy staging.

on:
  push:
    branches:
      - dev
      - main
  pull_request:
    branches:
      - dev
      - main
  workflow_dispatch: {}

env:
  # EDIT THIS LINE to choose the target for manual (workflow_dispatch) runs
  # only. Push-triggered runs ignore this value entirely - see note above.
  # Allowed values: dev, staging, prod
  MANUAL_DEPLOY_ENV: dev

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64, datalake]

    env:
      AWS_REGION: us-east-1

    # NOTE: GitHub Actions does NOT expose the `env` context inside this
    # `environment:` key - only github/vars/inputs/needs are valid here.
    # This field is purely for GitHub's optional deployment-approval feature;
    # it has no effect on the actual AWS deploy target (that's $DEPLOY_ENV,
    # set correctly below from the real MANUAL_DEPLOY_ENV shell env var).
    # So for a manual workflow_dispatch run, this just shows "dev" here
    # regardless of MANUAL_DEPLOY_ENV's value - cosmetic only, not a bug.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'dev' }}


    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set environment variables based on trigger
        run: |
          # workflow_dispatch (manual) reads the hardcoded MANUAL_DEPLOY_ENV
          # value from this file - push events always resolve to dev/prod
          # from the branch name, same as before.
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "DEPLOY_ENV=${MANUAL_DEPLOY_ENV}" >> $GITHUB_ENV
          elif [[ "${GITHUB_REF_NAME}" == "main" ]]; then
            echo "DEPLOY_ENV=prod" >> $GITHUB_ENV
          else
            echo "DEPLOY_ENV=dev" >> $GITHUB_ENV
          fi

          echo "CODEVERSION=$(echo $GITHUB_SHA | cut -c1-7)" >> $GITHUB_ENV

          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_REF_NAME=$GITHUB_REF_NAME"
          echo "GITHUB_EVENT_NAME=${{ github.event_name }}"

      - name: Validate DEPLOY_ENV
        run: |
          # Catches a typo'd MANUAL_DEPLOY_ENV (or any unexpected value) before
          # the Lambda build/upload steps run, rather than failing later at the
          # CloudFormation deploy step after time has already been spent.
          case "${DEPLOY_ENV}" in
            dev|staging|prod) ;;
            *)
              echo "ERROR: DEPLOY_ENV='${DEPLOY_ENV}' is not one of dev, staging, prod."
              echo "Check the MANUAL_DEPLOY_ENV value near the top of this workflow file."
              exit 1
              ;;
          esac

      - name: Resolve script/artifact env token
        run: |
          # ARTIFACT_ENV_TOKEN: matches the template's EnvToken logic
          # (IsProd ? prod : dev) - used inside artifact FILENAMES.
          #
          # ARTIFACT_BUCKET: dev and staging ALWAYS use the same build-dev
          # bucket - there is no separate "-build-staging" bucket in AWS.
          # Only prod gets its own bucket.
          #
          # ARTIFACT_PREFIX: dev and prod use the normal "sentiment-artifact"
          # S3 folder. staging uses a SEPARATE "staging-sentiment-artifact"
          # folder in that same shared bucket, so a staging deploy uploads
          # and reads its own isolated copies of every Lambda zip and Glue
          # script - it no longer shares artifact files with dev at all.
          if [ "${DEPLOY_ENV}" == "prod" ]; then
            echo "ARTIFACT_ENV_TOKEN=prod" >> $GITHUB_ENV
            echo "ARTIFACT_BUCKET=psegli-datalakenonprodli-datalake-build-prod" >> $GITHUB_ENV
            echo "ARTIFACT_PREFIX=sentiment-artifact" >> $GITHUB_ENV
          elif [ "${DEPLOY_ENV}" == "staging" ]; then
            echo "ARTIFACT_ENV_TOKEN=dev" >> $GITHUB_ENV
            echo "ARTIFACT_BUCKET=psegli-datalakenonprodli-datalake-build-dev" >> $GITHUB_ENV
            echo "ARTIFACT_PREFIX=staging-sentiment-artifact" >> $GITHUB_ENV
          else
            echo "ARTIFACT_ENV_TOKEN=dev" >> $GITHUB_ENV
            echo "ARTIFACT_BUCKET=psegli-datalakenonprodli-datalake-build-dev" >> $GITHUB_ENV
            echo "ARTIFACT_PREFIX=sentiment-artifact" >> $GITHUB_ENV
          fi

      - name: Build and upload Lambda artifacts
        run: |
          LAMBDA_BASE="source/pipeline/lambda-functions"

          # 13 Lambda functions - names must exactly match:
          #   1) the folder name under lambda-functions/<name>/python/<name>.py
          #   2) the FunctionName base used in the CloudFormation template
          #   3) the S3Key base the template's !Sub expects
          LAMBDAS=(
            "datalake-comprehend-actionable"
            "datalake-comprehend-clean-temp"
            "datalake-comprehend-corrected-output"
            "datalake-comprehend-create-endpoints"
            "datalake-comprehend-delete-endpoints"
            "datalake-comprehend-final-output"
            "datalake-comprehend-level2"
            "datalake-comprehend-level3"
            "datalake-comprehend-level4"
            "datalake-comprehend-raw-status-check"
            "datalake-comprehend-sentiment"
            "datalake-comprehend-urgent"
            "datalake-sentiment-analysis-get-availability"
          )

          for name in "${LAMBDAS[@]}"; do
            SRC_DIR="${LAMBDA_BASE}/${name}/python"
            if [ -f "${SRC_DIR}/${name}.py" ]; then
              # Zip must contain the python/ subfolder itself (not just its
              # contents), matching the Handler convention: python.<name>.lambda_handler
              mkdir -p "build/${name}/python"
              cp "${SRC_DIR}/${name}.py" "build/${name}/python/"
              (cd "build/${name}" && zip -r "../../${name}.zip" python)
              aws s3 cp "${name}.zip" \
                "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/${name}_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.zip" \
                --no-verify-ssl
            else
              echo "WARNING: ${SRC_DIR}/${name}.py not found - skipping ${name}"
            fi
          done

      - name: Upload Glue scripts
        run: |
          # Path CONFIRMED via screenshot: source/pipeline/glue/<script>.py
          GLUE_BASE="source/pipeline/glue"

          mkdir -p build

          for script in datalake-sentiment-analysis datalake-sentiment-analysis-curation; do
            SRC="${GLUE_BASE}/${script}.py"
            if [ -f "$SRC" ]; then
              cp "$SRC" "build/${script}_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.py"
              aws s3 cp "build/${script}_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.py" \
                "s3://${ARTIFACT_BUCKET}/${ARTIFACT_PREFIX}/" --no-verify-ssl
            else
              echo "WARNING: ${SRC} not found - skipping ${script}"
            fi
          done

          # datalake-comprehend-glue uses its own separate, already-confirmed
          # script location (datalake_nonprod-Glue_Scripts/) - NOT the shared
          # sentiment-artifact prefix used by the two jobs above.
          COMPREHEND_GLUE_SRC="${GLUE_BASE}/datalake-comprehend-glue.py"
          if [ -f "$COMPREHEND_GLUE_SRC" ]; then
            cp "$COMPREHEND_GLUE_SRC" "build/datalake-comprehend-glue_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.py"
            aws s3 cp "build/datalake-comprehend-glue_${CODEVERSION}_${ARTIFACT_ENV_TOKEN}.py" \
              "s3://${ARTIFACT_BUCKET}/datalake_nonprod-Glue_Scripts/" --no-verify-ssl
          else
            echo "WARNING: ${COMPREHEND_GLUE_SRC} not found - skipping datalake-comprehend-glue"
          fi

      - name: Validate CloudFormation template
        run: |
          TEMPLATE="$GITHUB_WORKSPACE/source/cloudformation/sentiment_analysis_stack.yml"
          aws cloudformation validate-template --template-body file://"$TEMPLATE"

      - name: Deploy CloudFormation stack
        run: |
          TEMPLATE="$GITHUB_WORKSPACE/source/cloudformation/sentiment_analysis_stack.yml"
          STACK_NAME="datalake-sentiment-analysis-infra-${DEPLOY_ENV}"

          # No --capabilities flag needed: this template creates zero IAM
          # resources (Ground Rule 1) - all roles are referenced by name only.
          aws cloudformation deploy \
            --template-file "$TEMPLATE" \
            --stack-name "$STACK_NAME" \
            --parameter-overrides \
              DeployEnv=${DEPLOY_ENV} \
              ArtifactBucket=${ARTIFACT_BUCKET} \
              CodeVersion=${CODEVERSION}

      - name: Print CloudFormation Events on Failure
        if: always()
        run: |
          aws cloudformation describe-stack-events \
            --stack-name "datalake-sentiment-analysis-infra-${DEPLOY_ENV}" \
            --query 'StackEvents[?ResourceStatus==`FAILED`]' \
            --max-items 50