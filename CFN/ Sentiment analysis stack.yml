AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Sentiment Analysis Data Lake Pipeline - daily-use survey/comprehend pipeline.
  Deploys the sentiment-analysis Glue jobs, Lambda functions, Step Functions,
  EventBridge trigger, and SNS alerting for the CCaaS survey -> sentiment ->
  Comprehend classification pipeline. The model-training/eval pipeline
  (datalake-comprehend-training-temp) is intentionally out of scope and lives
  in a separate CloudFormation stack so it can be updated independently.

Parameters:

  DeployEnv:
    Type: String
    Description: "Deployment environment. dev and staging both deploy into the nonprod AWS account as fully independent, parallel stacks. prod is reserved for future use."
    AllowedValues:
      - dev
      - staging
      - prod

  # --- Existing S3 buckets (NOT created by this template - see Ground Rule 2) ---

  ArtifactBucket:
    Type: String
    Description: "Existing S3 bucket where CI/CD uploads Lambda zips, Glue scripts, and Step Function definitions for this pipeline."
    Default: psegli-datalakenonprodli-datalake-build-dev

  CuratedBucketName:
    Type: String
    Description: "Existing S3 bucket holding curated survey data - source for the sentiment/comprehend pipeline (sentiment_analysis/final/{source}/ paths)."
    Default: psegli-datalakenonprodli-datalake-curated-dev

  TempBucketName:
    Type: String
    Description: "Existing S3 bucket used as scratch/working storage by the comprehend pipeline (Sentiment_Analysis/raw_data, runs/, etc.)."
    Default: psegli-datalakenonprodli-datalake-temp-dev

  GlueTempDirPath:
    Type: String
    Description: >-
      Existing S3 path used as the Glue "--TempDir" working directory for the
      sentiment-analysis and sentiment-analysis-curation jobs. NOTE: this is a
      distinct bucket (build-nonprod) from ArtifactBucket (build-dev) - confirmed
      via Job details screenshot, not assumed. Flagging for confirmation since it
      doesn't follow the same naming pattern as the other three bucket parameters.
    Default: s3://psegli-datalakenonprodli-datalake-build-nonprod/datalake-nonprod-Glue_Temp/

  # --- Existing shared IAM roles (NOT created by this template - see Ground Rule 1) ---
  # NOTE: confirmed with lead - these three roles stay pinned to their "-dev" suffix
  # regardless of DeployEnv. A "staging" deploy still executes under the "-dev" roles.
  # There is no "-staging" variant of these roles today.

  LambdaExecutionRoleName:
    Type: String
    Description: "Existing shared IAM role name for Lambda execution. Intentionally NOT parameterized by DeployEnv - stays pinned to '-dev' for both dev and staging deploys."
    Default: Lambda-execution-datalake-dev

  StepFunctionExecutionRoleName:
    Type: String
    Description: "Existing shared IAM role name for Step Functions execution. Intentionally NOT parameterized by DeployEnv - stays pinned to '-dev' for both dev and staging deploys."
    Default: stepfunction-execution-datalake-dev

  GlueServiceRoleName:
    Type: String
    Description: "Existing shared IAM role name for Glue job execution. Intentionally NOT parameterized by DeployEnv - stays pinned to '-dev' for both dev and staging deploys."
    Default: AWSGlueServiceRole-datalake-dev

  EventBridgeToStepFunctionsRoleName:
    Type: String
    Description: "Existing shared IAM role name allowing EventBridge rules to start Step Functions executions. Intentionally NOT parameterized by DeployEnv."
    Default: EventBridgeServiceToStepFunctionsRole-datalake-dev

  # --- Cross-service role that structurally requires manual creation (Ground Rule 1) ---
  # This is NOT one of our three reusable shared roles. Comprehend needs a role it can
  # assume for cross-service data access (S3 read for training/inference data). This
  # must be created manually outside this template if it does not already exist for
  # the target environment - flagging per Ground Rule 1 rather than creating it inline.

  ComprehendDataAccessRoleArn:
    Type: String
    Description: "ARN of the existing IAM role Comprehend assumes for cross-service S3 data access. NOT created by this template - must exist already (see AmazonComprehendServiceRole-DataLakeNonProd for dev)."
    Default: arn:aws:iam::053234861925:role/service-role/AmazonComprehendServiceRole-DataLakeNonProd

  # --- Versioning / artifacts ---

  CodeVersion:
    Type: String
    Description: "Short git SHA or version identifier for artifacts, matching the CI/CD packaging convention (first 7 chars of GITHUB_SHA)."
    Default: latest

  SentimentArtifactPrefix:
    Type: String
    Description: "S3 key prefix (within ArtifactBucket) where CI/CD uploads this pipeline's Lambda zips and Glue scripts. Kept separate from the ccaas pipeline's 'ccaas-artifact' prefix."
    Default: sentiment-artifact

  # --- Alerting ---

  AlertEmail:
    Type: String
    Default: ""
    Description: "Optional email address to subscribe to the sentiment-analysis SNS alerts topic. Leave blank to create the topic with no subscription (e.g. for a staging deploy where no one should be auto-subscribed)."

Conditions:

  IsProd: !Equals [!Ref DeployEnv, "prod"]
  HasAlertEmail: !Not [!Equals [!Ref AlertEmail, ""]]

Mappings:
  # NOTE on ResourceSuffix (org naming rule, confirmed 2026-07-23):
  # Every resource this template creates must have a name ending in "-dev"
  # (nonprod tier) or "-prod" (prod tier) - resources not following this
  # convention will not be created / will be rejected. Because "staging" is
  # a CloudFormation-only concept (dev and staging share the same nonprod
  # AWS account), a staging deploy inserts "staging-" as a middle segment
  # rather than replacing the mandatory trailing "-dev":
  #   dev:      datalake-<resource>-dev
  #   staging:  datalake-<resource>-staging-dev
  #   prod:     datalake-<resource>-prod
  # This is distinct from StagingArg, which drives the Glue job's internal
  # "--STAGING" argument (S3 data-path segmentation), per the original spec.
  EnvConfig:
    dev:
      AccountTier: nonprod
      StagingArg: "dev"
      ResourceSuffix: "dev"
    staging:
      AccountTier: nonprod
      StagingArg: "staging"
      ResourceSuffix: "staging-dev"
    prod:
      AccountTier: prod
      StagingArg: "dev"
      ResourceSuffix: "prod"

Resources:

  # --- SNS: failure alerting for the sentiment analysis pipeline ---
  # Replicated per environment (dev / staging / prod each get their own topic),
  # per confirmed decision: dev already has a live topic + confirmed email
  # subscription (datalake-sentiment-analysis-alerts-dev) that this template
  # will now formally manage going forward, and staging/prod get their own
  # independent copies when deployed.

  SentimentAlertsTopic:
    Type: AWS::SNS::Topic
    Properties:
      TopicName: !Sub
        - "datalake-sentiment-analysis-alerts-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]

  SentimentAlertsSubscription:
    Type: AWS::SNS::Subscription
    Condition: HasAlertEmail
    Properties:
      Protocol: email
      Endpoint: !Ref AlertEmail
      TopicArn: !Ref SentimentAlertsTopic

  # --- Glue Jobs ---
  # NOTE on ScriptLocation naming: today's live jobs use plain, unversioned
  # script filenames (e.g. "datalake-sentiment-analysis-dev.py"), configured
  # manually. Once this template + updated CI/CD own these jobs, scripts need
  # to be uploaded as versioned artifacts to be reproducible/rollback-able -
  # so ScriptLocation below follows the same "{name}_{CodeVersion}_{EnvToken}.py"
  # convention already used by the ccaas pipeline's CI/CD. EnvToken here is
  # "dev"/"prod" (via IsProd), NOT the staging-aware ResourceSuffix - CONFIRMED:
  # dev and staging share the same compiled script artifact (same nonprod
  # tier, same code); only the job's *name* and *runtime arguments* (--STAGING)
  # differ between dev and staging, not the underlying script file.

  SentimentAnalysisGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub
        - "datalake-sentiment-analysis-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueServiceRoleName}"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub
          - "s3://${ArtifactBucket}/${SentimentArtifactPrefix}/datalake-sentiment-analysis_${CodeVersion}_${EnvToken}.py"
          - EnvToken: !If [IsProd, "prod", "dev"]
      GlueVersion: "5.1"
      WorkerType: G.1X
      NumberOfWorkers: 10
      MaxRetries: 0
      Timeout: 480
      ExecutionProperty:
        MaxConcurrentRuns: 5
      DefaultArguments:
        "--TempDir": !Ref GlueTempDirPath
        "--conf": "spark.eventLog.rolling.enabled=true"
        "--mode": "manual"
        "--job-bookmark-option": "job-bookmark-disable"
        "--enable-metrics": "true"
        "--enable-observability-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--ENV": !If [IsProd, "prod", "dev"]
        "--STAGING": !FindInMap [EnvConfig, !Ref DeployEnv, StagingArg]

  SentimentAnalysisCurationGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub
        - "datalake-sentiment-analysis-curation-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueServiceRoleName}"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub
          - "s3://${ArtifactBucket}/${SentimentArtifactPrefix}/datalake-sentiment-analysis-curation_${CodeVersion}_${EnvToken}.py"
          - EnvToken: !If [IsProd, "prod", "dev"]
      GlueVersion: "5.1"
      WorkerType: G.1X
      NumberOfWorkers: 10
      MaxRetries: 0
      Timeout: 480
      ExecutionProperty:
        MaxConcurrentRuns: 5
      DefaultArguments:
        "--TempDir": !Ref GlueTempDirPath
        "--conf": "spark.eventLog.rolling.enabled=true"
        "--mode": "manual"
        "--job-bookmark-option": "job-bookmark-disable"
        "--enable-metrics": "true"
        "--enable-observability-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--ENV": !If [IsProd, "prod", "dev"]
        "--STAGING": !FindInMap [EnvConfig, !Ref DeployEnv, StagingArg]

  ComprehendGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub
        - "datalake-comprehend-glue-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueServiceRoleName}"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub
          - "s3://${ArtifactBucket}/datalake_nonprod-Glue_Scripts/datalake-comprehend-glue_${CodeVersion}_${EnvToken}.py"
          - EnvToken: !If [IsProd, "prod", "dev"]
      GlueVersion: "5.1"
      WorkerType: G.1X
      NumberOfWorkers: 10
      MaxRetries: 0
      Timeout: 480
      ExecutionProperty:
        MaxConcurrentRuns: 1
      DefaultArguments:
        "--TempDir": !Sub "s3://aws-glue-assets-${AWS::AccountId}-${AWS::Region}/temporary/"
        "--enable-spark-ui": "true"
        "--spark-event-logs-path": !Sub "s3://aws-glue-assets-${AWS::AccountId}-${AWS::Region}/sparkHistoryLogs/"
        "--conf": "spark.eventLog.rolling.enabled=true"
      Tags:
        use-case: sentiment-analysis

  # --- CCaaS Reconciliation Report Glue Job ---
  # PySpark job (glueetl, not pythonshell), GlueVersion 5.1 to match every other
  # Glue job in this stack (confirmed - overrides the originally-requested 5.0).
  # Script path follows the SentimentAnalysisGlueJob convention (parameterized
  # ${SentimentArtifactPrefix}), per confirmed decision, even though this job is
  # CCaaS-specific rather than sentiment-specific - kept in the same shared
  # artifact folder rather than creating a new prefix parameter.
  #
  # --EVENT_DATE is intentionally NOT included in DefaultArguments: it's a
  # single-date manual-run override, read via manual sys.argv parsing in the
  # job script (per this project's established convention), and left absent
  # by default so a normal scheduled/triggered run doesn't accidentally pin
  # itself to one date. Pass it at invocation time only when doing a targeted
  # single-date run.
  #
  # --EVENT_DATES_S3_PATH DOES have a real default, confirmed via console
  # screenshot of the live job's Job Parameters tab - it's not actually
  # optional/absent in practice the way --EVENT_DATE is, so it's included
  # below with its real value.

  ReconciliationReportGlueJob:
    Type: AWS::Glue::Job
    Properties:
      Name: !Sub
        - "datalake-ccaas-reconciliation-report-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueServiceRoleName}"
      Command:
        Name: glueetl
        PythonVersion: "3"
        ScriptLocation: !Sub
          - "s3://${ArtifactBucket}/${SentimentArtifactPrefix}/datalake-ccaas-reconciliation-report_${CodeVersion}_${EnvToken}.py"
          - EnvToken: !If [IsProd, "prod", "dev"]
      GlueVersion: "5.1"
      WorkerType: G.1X
      NumberOfWorkers: 10
      MaxRetries: 0
      Timeout: 480
      ExecutionProperty:
        MaxConcurrentRuns: 1
      DefaultArguments:
        "--TempDir": !Ref GlueTempDirPath
        "--conf": "spark.eventLog.rolling.enabled=true"
        "--job-bookmark-option": "job-bookmark-disable"
        "--enable-metrics": "true"
        "--enable-observability-metrics": "true"
        "--enable-continuous-cloudwatch-log": "true"
        "--ENV": !If [IsProd, "prod", "dev"]
        "--EVENT_DATES_S3_PATH": "s3://psegli-datalakenonprodli-datalake-temp-dev/ccaas/event_dates/survey_api_json/event_dates.json"
      Tags:
        use-case: ccaas-reconciliation
  # Replicated per environment (Option 2, per confirmed decision). Schema confirmed
  # via console: partition key execution_date (String), no sort key, on-demand
  # billing, no GSIs, PITR off. The Lambda now reads this table's name from the
  # TRACKER_TABLE_NAME environment variable (code updated to remove the previous
  # hardcoded "datalake-sentiment-analysis-tracker-dev" literal).

  SentimentAnalysisTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
        - "datalake-sentiment-analysis-tracker-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: execution_date
          AttributeType: S
      KeySchema:
        - AttributeName: execution_date
          KeyType: HASH

  # --- CCaaS Reconciliation Report Crawler ---
  # Catalogs the Glue job's output. NOT triggered by EventBridge or any
  # schedule - per confirmed decision, the Glue job itself calls
  # boto3 start_crawler() at the end of a successful run. This resource only
  # needs to exist for that call to have a crawler to target; no trigger
  # resource is created here.
  #
  # DatabaseName confirmed via Glue console screenshot of Data Catalog ->
  # Databases: "datalake-sentiment-analysis-dev" - same database every other
  # CCaaS/sentiment table in this project is cataloged under, exactly as
  # originally guessed but confirmed rather than assumed.

  ReconciliationReportCrawler:
    Type: AWS::Glue::Crawler
    Properties:
      Name: !Sub
        - "datalake-reconciliation-report-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${GlueServiceRoleName}"
      DatabaseName: datalake-sentiment-analysis-dev
      Targets:
        S3Targets:
          - Path: !Sub "s3://${CuratedBucketName}/ccaas/data_reconciliation_report/"
      SchemaChangePolicy:
        UpdateBehavior: UPDATE_IN_DATABASE
        DeleteBehavior: LOG

  # --- CCaaS Reconciliation DynamoDB table ---
  # Same shape/pattern as SentimentAnalysisTrackerTable above (on-demand
  # billing, no GSIs/LSIs), extended with a sort key per the confirmed schema:
  # partition key event_date (String), sort key survey_type (String) - allows
  # multiple survey types to be tracked per date without overwriting each
  # other, same reasoning as the update_item-over-put_item principle already
  # established for the sentiment tracker table.

  ReconciliationTrackerTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub
        - "datalake-ccaas-reconciliation-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: event_date
          AttributeType: S
        - AttributeName: survey_type
          AttributeType: S
      KeySchema:
        - AttributeName: event_date
          KeyType: HASH
        - AttributeName: survey_type
          KeyType: RANGE

  # --- Lambda Functions (13 total) ---
  # Shared settings (Runtime/Timeout/MemorySize/EphemeralStorage) confirmed via
  # console screenshot of an existing function's Configuration tab. Handler
  # convention (python.<filename>.lambda_handler) confirmed via repo folder
  # structure - every function's zip contains a python/ subfolder.

  ComprehendActionableLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-actionable-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-actionable.lambda_handler
      Runtime: python3.13
      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-actionable_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendCleanTempLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-clean-temp-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-clean-temp.lambda_handler
      Runtime: python3.13
      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-clean-temp_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendCorrectedOutputLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-corrected-output-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-corrected-output.lambda_handler
