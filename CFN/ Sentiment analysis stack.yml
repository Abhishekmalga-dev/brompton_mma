      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-corrected-output_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendCreateEndpointsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-create-endpoints-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-create-endpoints.lambda_handler
      Runtime: python3.13
      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-create-endpoints_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendDeleteEndpointsLambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-delete-endpoints-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-delete-endpoints.lambda_handler
      Runtime: python3.13
      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-delete-endpoints_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendFinalOutputLambda:
