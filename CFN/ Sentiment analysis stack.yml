          ENV: !If [IsProd, "prod", "dev"]

  ComprehendLevel3Lambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-level3-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-level3.lambda_handler
