        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-final-output_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
      Environment:
        Variables:
          ENV: !If [IsProd, "prod", "dev"]

  ComprehendLevel2Lambda:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub
        - "datalake-comprehend-level2-${Suffix}"
        - Suffix: !FindInMap [EnvConfig, !Ref DeployEnv, ResourceSuffix]
      Role: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${LambdaExecutionRoleName}"
      Handler: python.datalake-comprehend-level2.lambda_handler
      Runtime: python3.13
      Timeout: 421
      MemorySize: 10240
      EphemeralStorage:
        Size: 10240
      Code:
        S3Bucket: !Ref ArtifactBucket
        S3Key: !Sub
          - "${SentimentArtifactPrefix}/datalake-comprehend-level2_${CodeVersion}_${EnvToken}.zip"
          - EnvToken: !If [IsProd, "prod", "dev"]
